services:
  - type: web
    name: winco-so-theo-doi-nai
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Đặt thủ công trong Render Dashboard (không lưu trong repo):
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false

